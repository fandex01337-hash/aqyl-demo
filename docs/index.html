<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aqyl — ИИ-консультант AgroQazyna</title>
<meta name="description" content="Aqyl — ИИ-консультант по удобрениям: подбор по культуре, расчёт стоимости, доставка по всему Казахстану, заявка в чате.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Талисман Aqyl и колос -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="aqyl-av" viewBox="0 0 120 120">
      <circle cx="60" cy="74" r="35" fill="#fff3d9" stroke="#e5c98a" stroke-width="2"/>
      <circle cx="37" cy="85" r="6" fill="#f6a5a0" opacity=".65"/>
      <circle cx="83" cy="85" r="6" fill="#f6a5a0" opacity=".65"/>
      <g class="blink"><ellipse cx="46" cy="74" rx="5.2" ry="6.8" fill="#2b2118"/><ellipse cx="74" cy="74" rx="5.2" ry="6.8" fill="#2b2118"/>
        <circle cx="47.8" cy="71.5" r="1.9" fill="#fff"/><circle cx="75.8" cy="71.5" r="1.9" fill="#fff"/></g>
      <path d="M49 88 Q60 98 71 88" stroke="#2b2118" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <path d="M29 46 Q60 2 91 46 Z" fill="#e9c46a"/>
      <path d="M31 44 Q60 16 89 44" stroke="#d1a63f" stroke-width="2" fill="none"/>
      <rect x="31" y="38" width="58" height="7" rx="3" fill="#c8553d"/>
      <ellipse cx="60" cy="46" rx="47" ry="8" fill="#f1d183" stroke="#d1a63f" stroke-width="1.5"/>
      <g class="sway"><path d="M60 22 L60 8" stroke="#2f8f57" stroke-width="3" stroke-linecap="round"/>
        <path d="M60 12 Q48 2 42 10 Q52 18 60 12Z" fill="#3fa66b"/><path d="M60 12 Q72 2 78 10 Q68 18 60 12Z" fill="#58c083"/></g>
    </symbol>
    <symbol id="ear" viewBox="0 0 24 90">
      <path d="M12 90 L12 30" stroke="#b98a22" stroke-width="2.2" stroke-linecap="round"/>
      <g fill="#e3b53c" stroke="#b98a22" stroke-width=".6">
        <ellipse cx="7" cy="28" rx="4" ry="8" transform="rotate(-18 7 28)"/><ellipse cx="17" cy="28" rx="4" ry="8" transform="rotate(18 17 28)"/>
        <ellipse cx="7" cy="40" rx="4" ry="8" transform="rotate(-18 7 40)"/><ellipse cx="17" cy="40" rx="4" ry="8" transform="rotate(18 17 40)"/>
        <ellipse cx="7" cy="16" rx="3.8" ry="7.5" transform="rotate(-18 7 16)"/><ellipse cx="17" cy="16" rx="3.8" ry="7.5" transform="rotate(18 17 16)"/>
        <ellipse cx="12" cy="7" rx="3.6" ry="7"/></g>
    </symbol>
  </defs>
</svg>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#top"><svg class="av" viewBox="0 0 120 120"><use href="#aqyl-av"/></svg><span id="company">AgroQazyna</span></a>
    <nav class="nav">
      <a href="#products" data-i18n="nav_products"></a>
      <a href="#crops" data-i18n="nav_crops"></a>
      <a href="#how" data-i18n="nav_how"></a>
      <a href="#delivery" data-i18n="nav_delivery"></a>
      <a href="#faq" data-i18n="nav_faq"></a>
    </nav>
    <div class="tools">
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="ru">RU</button><button data-lang="kk">ҚАЗ</button><button data-lang="en">EN</button>
      </div>
      <button class="btn ghost sm" id="open-panel" data-i18n="panel_btn"></button>
    </div>
  </div>
</header>

<main id="top">
<section class="hero" style="padding:0">
  <svg class="bg" viewBox="0 0 1440 640" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9dcf0"/><stop offset=".6" stop-color="#e6f3e0"/><stop offset="1" stop-color="#fff0c4"/></linearGradient>
      <radialGradient id="sun"><stop offset="0" stop-color="#fff4b0"/><stop offset=".45" stop-color="#ffd86b"/><stop offset="1" stop-color="#ffd86b" stop-opacity="0"/></radialGradient>
      <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1cb5c"/><stop offset="1" stop-color="#d9a52e"/></linearGradient>
    </defs>
    <rect width="1440" height="640" fill="url(#sky)"/>
    <circle cx="1150" cy="150" r="190" fill="url(#sun)"/>
    <g fill="#fff" opacity=".85"><ellipse cx="250" cy="110" rx="90" ry="24"/><ellipse cx="310" cy="96" rx="60" ry="22"/><ellipse cx="760" cy="70" rx="80" ry="20"/><ellipse cx="820" cy="58" rx="50" ry="18"/><ellipse cx="1330" cy="260" rx="70" ry="18"/></g>
    <path d="M0 400 Q220 330 460 392 T920 380 T1440 372 V640 H0Z" fill="#bcdca4"/>
    <path d="M0 450 Q300 392 620 442 T1440 430 V640 H0Z" fill="#8fc566"/>
    <g stroke="#7db556" stroke-width="3" fill="none" opacity=".7"><path d="M0 480 Q360 430 700 478 T1440 462"/><path d="M0 505 Q380 455 740 500 T1440 486"/></g>
    <path d="M0 520 Q320 470 700 520 T1440 504 V640 H0Z" fill="url(#gold)"/>
    <g stroke="#c5922a" stroke-width="2.5" fill="none" opacity=".55"><path d="M0 548 Q340 500 700 548 T1440 532"/><path d="M0 578 Q340 530 700 578 T1440 562"/><path d="M0 608 Q340 560 700 608 T1440 592"/></g>
    <g>
      <use href="#ear" x="40" y="500" width="30" height="112"/><use href="#ear" x="130" y="520" width="26" height="98"/><use href="#ear" x="250" y="505" width="32" height="118"/>
      <use href="#ear" x="420" y="525" width="26" height="98"/><use href="#ear" x="610" y="510" width="30" height="112"/><use href="#ear" x="820" y="522" width="28" height="104"/>
      <use href="#ear" x="990" y="505" width="32" height="118"/><use href="#ear" x="1130" y="525" width="26" height="98"/><use href="#ear" x="1260" y="508" width="30" height="112"/><use href="#ear" x="1370" y="520" width="28" height="104"/>
    </g>
  </svg>
  <div class="wrap">
    <div>
      <span class="badge" id="badge" data-i18n="hero_badge"></span>
      <h1 id="hero-h1"></h1>
      <p class="lead" data-i18n="hero_lead"></p>
      <div class="cta">
        <button class="btn" id="cta-chat" data-i18n="hero_cta1"></button>
        <a class="btn gold" href="#products" data-i18n="hero_cta2"></a>
      </div>
    </div>
    <div class="mascot" id="mascot" role="button" tabindex="0" aria-label="Aqyl">
      <div class="say" id="mascot-say"></div>
      <svg viewBox="0 0 120 120" width="100%"><use href="#aqyl-av"/></svg>
    </div>
  </div>
</section>

<div class="stats"><div class="wrap"><div class="grid" id="stats"></div></div></div>

<section id="products"><div class="wrap">
  <h2 class="sec-title" data-i18n="products_title"></h2>
  <p class="sec-sub" data-i18n="products_sub"></p>
  <div class="cards" id="product-cards"></div>
  <p class="note" data-i18n="products_note"></p>
</div></section>

<section id="crops" class="alt"><div class="wrap">
  <h2 class="sec-title" data-i18n="crops_title"></h2>
  <p class="sec-sub" data-i18n="crops_sub"></p>
  <div class="crops" id="crop-cards"></div>
</div></section>

<section id="how"><div class="wrap">
  <h2 class="sec-title" data-i18n="how_title"></h2>
  <p class="sec-sub" data-i18n="how_sub"></p>
  <div class="steps" id="steps"></div>
</div></section>

<section id="delivery" class="alt"><div class="wrap">
  <h2 class="sec-title" data-i18n="delivery_title"></h2>
  <p class="sec-sub" data-i18n="delivery_sub"></p>
  <div class="regions" id="regions"></div>
  <p class="note" data-i18n="delivery_note"></p>
</div></section>

<section id="faq"><div class="wrap">
  <h2 class="sec-title" data-i18n="faq_title"></h2>
  <p class="sec-sub" data-i18n="faq_sub"></p>
  <div id="faq-list"></div>
</div></section>

<section class="alt"><div class="wrap">
  <div class="card demo-hint">
    <h2 class="sec-title" style="font-size:24px" data-i18n="demo_title"></h2>
    <ol id="demo-steps"></ol>
  </div>
</div></section>
</main>

<footer id="contacts"><div class="wrap">
  <div class="cols">
    <div><h3 id="company2">AgroQazyna</h3><p data-i18n="foot_about"></p></div>
    <div><h3 data-i18n="foot_contacts"></h3><p data-i18n="foot_contacts_text"></p></div>
    <div><h3 data-i18n="foot_ai"></h3><p data-i18n="foot_ai_text"></p></div>
  </div>
  <small data-i18n="foot_demo"></small>
</div></footer>

<div id="bubble" style="display:none"></div>
<button id="fab" aria-label="Chat"><svg class="av" viewBox="0 0 120 120"><use href="#aqyl-av"/></svg></button>
<div id="chat" role="dialog" aria-label="Aqyl">
  <div class="head">
    <svg class="av" viewBox="0 0 120 120"><use href="#aqyl-av"/></svg>
    <div><b>Aqyl</b><small><i></i><span id="chat-sub"></span></small></div>
    <button id="close-chat" aria-label="Close">×</button>
  </div>
  <div id="log" aria-live="polite"></div>
  <form id="form"><input id="input" autocomplete="off" maxlength="1000"><button class="btn" aria-label="Send">➤</button></form>
</div>

<div id="panel"><div class="box">
  <h2 class="sec-title" style="font-size:24px" data-i18n="panel_title"></h2>
  <div id="leads"></div>
  <div class="actions"><button class="btn ghost sm" id="clear-leads" data-i18n="panel_clear"></button><button class="btn sm" id="close-panel" data-i18n="panel_close"></button></div>
</div></div>

<script src="data.js"></script>
<script src="demo.js"></script>
<script src="site.js"></script>
</body>
</html>
